[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-pdf-ingestion"
version = "0.1.0"
authors = [
    {name = "Gonçalo Gomes", email = "goncalocfgomes@ua.pt"},
    {name = "Mário Antunes (original work)", email = "mario.antunes@ua.pt"}
]
description = "MCP server exposing one configured PDF through deterministic evidence tools and explicit visual questions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "document ingestion", "academic", "information retrieval", "pdf", "pymupdf"]
dependencies = [
    "fastmcp>=4.0.3,<5",
    "mcp>=2.2,<3",
    "openai>=3.6.0,<4",
    "pymupdf>=1.26",
    "ruff>=0.16.6",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "basedpyright",
    "vulture",
    "pre-commit",
    "build",
]

[project.scripts]
mcp-pdf-ingestion = "mcp_pdf_ingestion.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pdf_ingestion"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src/mcp_pdf_ingestion"]
reportImportCycles = "none"
reportReturnType = "none"

[tool.vulture]
paths = ["src/mcp_pdf_ingestion"]
min_confidence = 80
ignore_names = ["main", "_emergency_exit", "_on_sigint", "_on_sigterm_early",
                "_lifespan"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check .
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture src/mcp_pdf_ingestion
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest (tests)
        # Activate the project environment before running these optional hooks.
        entry: python -m unittest discover -s tests -p "test_*.py" -v
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
